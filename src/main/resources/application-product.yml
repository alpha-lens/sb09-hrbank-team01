spring:
  config:
    activate:
      on-profile: product
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:hrbank}?sslmode=require
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  logging:
    level:
      org.hibernate.type.descriptor.sql: trace
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
    open-in-view: false
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 30MB

file:
  upload-directory: ./file-data-map